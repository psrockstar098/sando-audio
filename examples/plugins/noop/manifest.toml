# Plugin manifest for the noop sample plugin.
#
# Phase 2: the loader reads this file (`plugins load --manifest`) and
# cross-checks it against the plugin's `sando_plugin` descriptor in
# the .so — the manifest is authoritative. `file` is relative to this
# manifest's directory (absolute paths are used as-is).

[plugin]
name = "noop"
version = "0.1.0"
kind = "effect"
file = "libsando-plugin-noop.so"
description = "Passthrough plugin proving the loader works."
