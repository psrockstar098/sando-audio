# SANDO Audio — example configuration.
# Copy to config/sando.toml and point the model files at real weights
# on disk. The engine NEVER downloads weights.
#
#   cp config/sando.example.toml config/sando.toml
#   sando-audio config validate config/sando.toml
#   sando-audio doctor

[runtime]
mode = "realtime"        # "realtime" | "offline"
sample_rate = 24000      # Hz; one of 8000, 16000, 22050, 24000, 32000, 44100, 48000
channels = 1             # 1 (mono) | 2 (stereo)

[hardware]
backend = "auto"         # "auto" | "cpu" | "cuda" | "hip" | "metal" | "vulkan" | "sycl" | "webgpu"
webgpu = true            # prefer WebGPU when it is the selected backend
low_power = true         # prefer low-power devices

[[models]]
name = "qwen3-tts-0.6b"
kind = "tts"             # "tts" | "stt" | "vad"
file = "models/qwen3-tts-12hz-0.6b-base-q8_0.gguf"
voice = "liberian-voice-01"
# Qwen3-TTS Base cannot speak without a speaker reference clip:
# its session throws at the first request when no reference audio
# is attached. `reference_wav` is the clip (WAV, any sample rate —
# the encoder resamples), `reference_text` its transcript, word for
# word. The shipped clip is a synthetic DEMO voice so the engine
# speaks out of the box; replace both lines with your own voice to
# change what Sando sounds like. (The fine-tuned LoRA is the real
# voice once fine-tuning finishes; the clip is what the base model
# clones from until then.)
reference_wav = "assets/voices/demo-voice.wav"
reference_text = "Hello, this is Sando, your Liberian voice. I can hear you, and I can speak."
streaming = true
language = "en"

[[models]]
# NOTE (Phase 2): the brief's Whisper-small-Q8_0 does not exist as a
# standalone GGUF in the audio.cpp hub, so Moonshine-Streaming-small
# (streaming-native ASR, 287 MB) substitutes for it. See STATUS.md.
name = "moonshine-small"
kind = "stt"
file = "models/moonshine-streaming-small-q8_0.gguf"
streaming = true
language = "en"

[[models]]
name = "silero-vad"
kind = "vad"
file = "models/silero_vad.onnx"
streaming = false

# Sando's voice, out of the box. This system prompt is the default for
# every brain (mock, agent, HTTP) unless the operator changes it here.
# It is the same persona the engine ships in code (see src/persona.zig):
# Sando talks like a real person, not like a voice assistant. Remove
# the whole [persona] section to use the built-in default as-is.
[persona]
system_prompt = "You are Sando. Talk like a real person, not like a voice assistant. Speak natural Liberian English, warm, easy, and free-flowing. Use Koloqua words and expressions when they fit, the way people in Liberia actually talk. Keep it short, like something you would say out loud. One or two sentences is usually enough; say more only when the person really needs it. You can talk about anything. If the person is just chatting, chat back. Answer questions straight, react to what they say, and ask something back when it feels natural. Remember what was said earlier in this conversation and build on it. Never introduce yourself as a machine or an assistant, and never open with a stiff greeting or an offer to help. Just talk."

# The brain model path. The engine does not run LLM weights itself —
# the brain lives behind an OpenAI-compatible server (Ollama by
# default). Set the server and model here; the --brain-url and
# --brain-model flags override these two lines for one run.
[brain]
url = "http://127.0.0.1:11434/v1/chat/completions"
model = "local"

# Sando Pulse, the knowledge side. On out of the box: when a turn
# needs knowledge, the engine asks Pulse first and the answer rides
# in the prompt. Set enabled = false to talk without Pulse;
# --no-pulse does the same for one run.
[pulse]
url = "http://127.0.0.1:9000"
enabled = true
