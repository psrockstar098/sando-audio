# SANDO Audio — example configuration.
# Copy to config/sando.toml and point the model files at real weights
# on disk. The engine NEVER downloads weights.
#
#   cp config/sando.example.toml config/sando.toml
#   sando-audio config validate config/sando.toml
#   sando-audio doctor

[runtime]
mode = "realtime"        # "realtime" | "offline"
sample_rate = 24000      # Hz; one of 8000, 16000, 22050, 24000, 32000, 44100, 48000
channels = 1             # 1 (mono) | 2 (stereo)

[hardware]
backend = "auto"         # "auto" | "cpu" | "cuda" | "hip" | "metal" | "vulkan" | "sycl" | "webgpu"
webgpu = true            # prefer WebGPU when it is the selected backend
low_power = true         # prefer low-power devices

[[models]]
name = "qwen3-tts-0.6b"
kind = "tts"             # "tts" | "stt" | "vad"
file = "models/qwen3-tts-12hz-0.6b-base-q8_0.gguf"
voice = "liberian-voice-01"
streaming = true
language = "en"

[[models]]
# NOTE (Phase 2): the brief's Whisper-small-Q8_0 does not exist as a
# standalone GGUF in the audio.cpp hub, so Moonshine-Streaming-small
# (streaming-native ASR, 287 MB) substitutes for it. See STATUS.md.
name = "moonshine-small"
kind = "stt"
file = "models/moonshine-streaming-small-q8_0.gguf"
streaming = true
language = "en"

[[models]]
name = "silero-vad"
kind = "vad"
file = "models/silero_vad.onnx"
streaming = false
